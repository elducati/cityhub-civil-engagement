services:
  postgres-test:
    image: postgres:16-alpine
    container_name: cityhub-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civic_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: cityhub-redis-test
    ports:
      - "6380:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:3.13-management-alpine
    container_name: cityhub-rabbitmq-test
    ports:
      - "5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  api-test:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: cityhub-api-test
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/civic_test
      DATABASE_POOL_SIZE: 5
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis-test:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq-test:5672
      NODE_ENV: test
      PORT: 3000
      SOCKET_PORT: 3001
      AUTH_JWT_SECRET: test-secret-key-minimum-32-characters!!!!
      AUTH_JWT_EXPIRY: 7d
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: silent
    ports:
      - "3100:3000"
      - "3101:3001"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
    command: >
      sh -c "npm run migrate && npm run dev"
