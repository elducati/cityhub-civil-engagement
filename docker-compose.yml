services:
  postgres:
    image: postgres:16-alpine
    container_name: cityhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cityhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: cityhub-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cityhub
      DATABASE_POOL_SIZE: 10
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: development
      PORT: 3000
      SOCKET_PORT: 3001
      AUTH_JWT_SECRET: dev-secret-key-minimum-32-characters-required
      AUTH_JWT_EXPIRY: 7d
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    container_name: cityhub-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:5173
      API_URL_FOR_SERVER: http://api:3000
      NODE_ENV: development
      PORT: 5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/app:/app/app
      - ./packages/frontend/components:/app/components
      - ./packages/frontend/lib:/app/lib
      - ./packages/frontend/hooks:/app/hooks
      - ./packages/frontend/types:/app/types
      - ./packages/frontend/styles:/app/styles
      - ./packages/frontend/contexts:/app/contexts
      - ./packages/frontend/config:/app/config
      - ./packages/frontend/public:/app/public
      - ./packages/frontend/next.config.js:/app/next.config.js
      - ./packages/frontend/tsconfig.json:/app/tsconfig.json
      - ./packages/frontend/package.json:/app/package.json
      - ./packages/frontend/tailwind.config.js:/app/tailwind.config.js
      - ./packages/frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - api

  # Test infrastructure services
  postgres-test:
    image: postgres:16-alpine
    container_name: cityhub-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: civic_test
    ports:
      - "5433:5432"
    profiles:
      - test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: cityhub-redis-test
    ports:
      - "6380:6379"
    profiles:
      - test
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-test:
    image: rabbitmq:3.13-management-alpine
    container_name: cityhub-rabbitmq-test
    ports:
      - "5673:5672"
    profiles:
      - test
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: