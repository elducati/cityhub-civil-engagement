version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cityhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cityhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cityhub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cityhub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    container_name: cityhub-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cityhub
      DATABASE_POOL_SIZE: 10
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      NODE_ENV: development
      PORT: 3000
      AUTH_JWT_SECRET: dev-secret-key-minimum-32-characters-required
      AUTH_JWT_EXPIRY: 7d
      AUTH_SESSION_SECRET: dev-session-secret-minimum-32-chars-required
      FRONTEND_URL: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    container_name: cityhub-web
    environment:
      VITE_API_URL: http://cityhub-api:3000
      VITE_APP_URL: http://localhost:5173
      VITE_NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: